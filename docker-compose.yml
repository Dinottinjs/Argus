
services:
  argus-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - argus-backend
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  argus-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://argus-redis:6379
    depends_on:
      - argus-redis
      - argus-db
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  argus-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M

  argus-db:
    image: postgis/postgis:15-3.3-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: argus_user
      POSTGRES_PASSWORD: argus_password
      POSTGRES_DB: argus_db
    volumes:
      - argus-pgdata:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  argus-pgdata:
